name: SimpleDocs
options:
  bundleIdPrefix: com.justinharbour.simpledocs
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # No signing identity, team or provisioning is configured. Signing is a separate, authorized step.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SimpleDocsKit:
    path: Packages/SimpleDocsKit
  SimpleDocsConnected:
    path: Packages/SimpleDocsConnected
  SimpleDocsOAuth:
    path: Packages/SimpleDocsOAuth
targets:
  SimpleDocsMacConnected:
    type: application
    platform: macOS
    sources: [Apps/MacConnected, Apps/ConnectedShared]
    info:
      path: Config/MacConnected-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.justinharbour.simpledocs]
    dependencies:
      - package: SimpleDocsKit
        product: SimpleDocsCore
      - package: SimpleDocsKit
        product: SimpleDocsViews
      - package: SimpleDocsConnected
        product: SimpleDocsConnected
      - package: SimpleDocsOAuth
        product: SimpleDocsOAuth
    settings:
      base:
        # Confirm App IDs and provisioning with the Apple Developer account before signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs
        PRODUCT_NAME: simpledocs
        CODE_SIGN_ENTITLEMENTS: Config/MacConnected.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: simpledocs
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  SimpleDocsiOS:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/ConnectedShared]
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.justinharbour.simpledocs]
    dependencies:
      - package: SimpleDocsKit
        product: SimpleDocsCore
      - package: SimpleDocsKit
        product: SimpleDocsViews
      - package: SimpleDocsConnected
        product: SimpleDocsConnected
      - package: SimpleDocsOAuth
        product: SimpleDocsOAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        PRODUCT_NAME: simpledocs
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: simpledocs
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SimpleDocsSignInTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ConnectedApp]
    dependencies:
      - target: SimpleDocsMacConnected
      - package: SimpleDocsConnected
        product: SimpleDocsConnected
      - package: SimpleDocsOAuth
        product: SimpleDocsOAuth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs.signintests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/simpledocs.app/Contents/MacOS/simpledocs"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SimpleDocsMacConnected:
    build: {targets: {SimpleDocsMacConnected: all}}
  SimpleDocsiOS:
    build: {targets: {SimpleDocsiOS: all}}
  SimpleDocsSignInTests:
    build: {targets: {SimpleDocsMacConnected: all, SimpleDocsSignInTests: [test]}}
    test: {targets: [SimpleDocsSignInTests]}
