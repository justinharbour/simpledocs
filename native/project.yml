name: SimpleDocs
options:
  bundleIdPrefix: com.justinharbour.simpledocs
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # CI supplies signing, team and release version build settings when authorized.
    MARKETING_VERSION: "$(SIMPLEDOCS_MARKETING_VERSION)"
    CURRENT_PROJECT_VERSION: "$(SIMPLEDOCS_BUILD_NUMBER)"
    SIMPLEDOCS_MARKETING_VERSION: "0.0.0"
    SIMPLEDOCS_BUILD_NUMBER: "1"
packages:
  SimpleDocsKit:
    path: Packages/SimpleDocsKit
  SimpleDocsConnected:
    path: Packages/SimpleDocsConnected
  SimpleDocsOAuth:
    path: Packages/SimpleDocsOAuth
  SimpleDocsDirect:
    path: Packages/SimpleDocsDirect
targets:
  SimpleDocsMacConnected:
    type: application
    platform: macOS
    sources: [Apps/MacConnected, Apps/ConnectedShared]
    info:
      path: Config/MacConnected-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.justinharbour.simpledocs]
    dependencies:
      - package: SimpleDocsKit
        product: SimpleDocsCore
      - package: SimpleDocsKit
        product: SimpleDocsViews
      - package: SimpleDocsConnected
        product: SimpleDocsConnected
      - package: SimpleDocsOAuth
        product: SimpleDocsOAuth
      - package: SimpleDocsDirect
        product: SimpleDocsDirect
      - target: SimpleDocsShareMac
    settings:
      base:
        # Confirm App IDs and provisioning with the Apple Developer account before signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs
        PRODUCT_NAME: simpledocs
        CODE_SIGN_ENTITLEMENTS: Config/MacConnected.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: simpledocs
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
  SimpleDocsShareMac:
    type: app-extension
    platform: macOS
    sources: [Apps/ShareMac]
    info:
      path: Config/Share-Mac-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs.share
        PRODUCT_NAME: simpledocs Share
        CODE_SIGN_ENTITLEMENTS: Config/Share-Mac.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
  SimpleDocsiOS:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/ConnectedShared]
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.justinharbour.simpledocs]
    dependencies:
      - package: SimpleDocsKit
        product: SimpleDocsCore
      - package: SimpleDocsKit
        product: SimpleDocsViews
      - package: SimpleDocsConnected
        product: SimpleDocsConnected
      - package: SimpleDocsOAuth
        product: SimpleDocsOAuth
      - package: SimpleDocsDirect
        product: SimpleDocsDirect
      - target: SimpleDocsShareiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        PRODUCT_NAME: simpledocs
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: simpledocs
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SimpleDocsShareiOS:
    type: app-extension
    platform: iOS
    sources: [Apps/ShareiOS]
    info:
      path: Config/Share-iOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs.share
        PRODUCT_NAME: simpledocs Share
        CODE_SIGN_ENTITLEMENTS: Config/Share-iOS.entitlements
        GENERATE_INFOPLIST_FILE: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
  SimpleDocsTV:
    type: application
    platform: tvOS
    sources: [Apps/TV]
    info:
      path: Config/TV-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs
        PRODUCT_NAME: SimpleDocsTV
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        INFOPLIST_KEY_CFBundleDisplayName: simpledocs
  SimpleDocsSignInTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ConnectedApp]
    dependencies:
      - target: SimpleDocsMacConnected
      - package: SimpleDocsConnected
        product: SimpleDocsConnected
      - package: SimpleDocsOAuth
        product: SimpleDocsOAuth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.justinharbour.simpledocs.signintests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/simpledocs.app/Contents/MacOS/simpledocs"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SimpleDocsMacConnected:
    build: {targets: {SimpleDocsMacConnected: all}}
  SimpleDocsiOS:
    build: {targets: {SimpleDocsiOS: all}}
  SimpleDocsTV:
    build: {targets: {SimpleDocsTV: all}}
  SimpleDocsSignInTests:
    build: {targets: {SimpleDocsMacConnected: all, SimpleDocsSignInTests: [test]}}
    test: {targets: [SimpleDocsSignInTests]}
