name: CI

# Runs only for pull requests. Fork PRs get no secrets and a read-only token.
# Do not add pull_request_target, secrets, OIDC or environments to this workflow.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: |
          "$RUNNER_TEMP/actionlint" -no-color

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title is a Conventional Commit."
          else
            echo "::error title=Invalid PR title::Use a Conventional Commit title, for example 'docs: clarify contributing steps'."
            exit 1
          fi

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  detect:
    name: Detect projects
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      web: ${{ steps.tracked.outputs.web }}
      native_package: ${{ steps.tracked.outputs.native_package }}
      native_direct: ${{ steps.tracked.outputs.native_direct }}
      native_apps: ${{ steps.tracked.outputs.native_apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tracked
        name: Record tracked projects
        run: |
          has() { if git ls-files --error-unmatch "$1" >/dev/null 2>&1; then echo true; else echo false; fi; }
          {
            echo "web=$(has web/package.json)"
            echo "native_package=$(has native/Packages/SimpleDocsKit/Package.swift)"
            echo "native_direct=$(has native/Packages/SimpleDocsDirect/Package.swift)"
            echo "native_apps=$(has native/project.yml)"
          } >> "$GITHUB_OUTPUT"

  web:
    name: Web (pnpm verify)
    needs: detect
    if: ${{ needs.detect.outputs.web == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify (check, build, test)
        run: pnpm verify
      - name: Verify core and migrations
        working-directory: backend/core
        run: npm test
      - name: Upload web build output
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: warn
          retention-days: 7

  native-package:
    name: Native (SimpleDocsKit swift test)
    needs: detect
    if: ${{ needs.detect.outputs.native_package == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Swift test
        working-directory: native/Packages/SimpleDocsKit
        run: swift test

  native-direct:
    name: Native (SimpleDocsDirect swift test)
    needs: detect
    if: ${{ needs.detect.outputs.native_direct == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Swift test
        working-directory: native/Packages/SimpleDocsDirect
        run: swift test

  native-apps:
    name: Native (${{ matrix.scheme }} build)
    needs: detect
    if: ${{ needs.detect.outputs.native_apps == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: SimpleDocsMacConnected
            destination: platform=macOS
          - scheme: SimpleDocsMacDirect
            destination: platform=macOS
          - scheme: SimpleDocsiOS
            destination: generic/platform=iOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Install XcodeGen 2.46.0
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        working-directory: native
        run: xcodegen generate
      - name: Build ${{ matrix.scheme }} unsigned
        working-directory: native
        run: |
          xcodebuild -project SimpleDocs.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" build CODE_SIGNING_ALLOWED=NO

  # Security-sensitive package that is intentionally not linked into any app yet. It does not use
  # `detect`: it always runs, and a missing package fails the guard instead of skipping the job.
  native-connected:
    name: Native (SimpleDocsConnected guard and swift test)
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard (present, unlinked, no networking or auth)
        run: native/Packages/SimpleDocsConnected/ci/guard.sh
      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
      - name: Swift test
        working-directory: native/Packages/SimpleDocsConnected
        env:
          MIN_TESTS: "30"
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/connected-test.log"
          # A run that discovers no tests also exits 0, so require evidence that tests ran and passed.
          line="$(grep -E 'Test run with [0-9]+ tests? .* passed' "$RUNNER_TEMP/connected-test.log" | tail -n 1 || true)"
          count="$(printf '%s' "$line" | sed -E 's/.*Test run with ([0-9]+) tests?.*/\1/')"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -lt "$MIN_TESTS" ]; then
            echo "::error title=SimpleDocsConnected tests::Expected a passing Swift Testing run of at least $MIN_TESTS tests, found: '${line:-none}'."
            exit 1
          fi
          echo "SimpleDocsConnected: $count tests passed."

  pr-gate:
    name: pr-gate
    if: ${{ always() }}
    needs: [detect, workflow-lint, pr-title, dependency-review, web, native-package, native-direct, native-apps, native-connected]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate checks and project presence
        env:
          LINT_RESULT: ${{ needs.workflow-lint.result }}
          TITLE_RESULT: ${{ needs.pr-title.result }}
          DEPS_RESULT: ${{ needs.dependency-review.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          WEB_TRACKED: ${{ needs.detect.outputs.web }}
          PKG_TRACKED: ${{ needs.detect.outputs.native_package }}
          DIRECT_TRACKED: ${{ needs.detect.outputs.native_direct }}
          APPS_TRACKED: ${{ needs.detect.outputs.native_apps }}
          WEB_RESULT: ${{ needs.web.result }}
          PKG_RESULT: ${{ needs.native-package.result }}
          DIRECT_RESULT: ${{ needs.native-direct.result }}
          APPS_RESULT: ${{ needs.native-apps.result }}
          CONNECTED_RESULT: ${{ needs.native-connected.result }}
        run: |
          failed=0
          check() {
            local name=$1 result=$2
            if [ "$result" != "success" ]; then
              echo "::error title=$name::$name finished with result: $result"
              failed=1
            fi
          }
          check "Detect projects" "$DETECT_RESULT"
          check "Workflow lint" "$LINT_RESULT"
          check "Conventional PR title" "$TITLE_RESULT"
          check "Dependency review" "$DEPS_RESULT"
          # Not conditional on detection: skipped, cancelled or missing is a failure.
          check "Native SimpleDocsConnected (guard and swift test)" "$CONNECTED_RESULT"

          # Fail closed: when detection did not succeed, project state is unknown, not absent.
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error title=Project state unknown::Project detection did not succeed, so project checks cannot be attributed."
            failed=1
          fi

          # A tracked project must have a job that ran and passed. An absent project is
          # reported as NOT RUN, which is shown in the summary and is not a pass.
          project_row() {
            local name=$1 tracked=$2 result=$3
            if [ "$tracked" = "true" ]; then
              check "$name" "$result"
              echo "| $name | tracked | $result |"
            elif [ "$tracked" = "false" ]; then
              echo "| $name | not present | NOT RUN |"
            else
              echo "::error title=Project state unknown::$name has invalid detection output."
              failed=1
              echo "| $name | unknown | NOT RUN |"
            fi
          }

          {
            echo "## simpledocs CI"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Detect projects | $DETECT_RESULT |"
            echo "| Workflow lint | $LINT_RESULT |"
            echo "| Conventional PR title | $TITLE_RESULT |"
            echo "| Dependency review | $DEPS_RESULT |"
            echo "| Native SimpleDocsConnected (guard and swift test) | $CONNECTED_RESULT |"
            echo
            echo "| Project | State | Result |"
            echo "| --- | --- | --- |"
            project_row "Web (pnpm verify)" "$WEB_TRACKED" "$WEB_RESULT"
            project_row "Native SimpleDocsKit (swift test)" "$PKG_TRACKED" "$PKG_RESULT"
            project_row "Native SimpleDocsDirect (swift test)" "$DIRECT_TRACKED" "$DIRECT_RESULT"
            project_row "Native apps (3 unsigned builds)" "$APPS_TRACKED" "$APPS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WEB_TRACKED$PKG_TRACKED$DIRECT_TRACKED$APPS_TRACKED" = "falsefalsefalsefalse" ]; then
            echo "::notice title=Application projects not run::No web or native project is tracked yet."
          fi

          exit "$failed"
