name: Deploy protected Worker

# Deployment is manual and only runs the reviewed default branch, never PR code.
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: simpledocs-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Build and test
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Configure protected hostname
        id: access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/worker/access-app.mjs
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: 4.163.0
          command: d1 migrations apply simpledocs-d1-prod --remote
      - name: Deploy protected Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: 4.163.0
          command: deploy --var ACCESS_TEAM_DOMAIN:https://justinharbour.cloudflareaccess.com --var ACCESS_AUDIENCE:${{ steps.access.outputs.audience }}
          secrets: |
            TELNYX_API_TOKEN
            POSTGRID_TEST_KEY
            POSTGRID_LIVE_KEY
        env:
          TELNYX_API_TOKEN: ${{ secrets.TELNYX_API_TOKEN }}
          POSTGRID_TEST_KEY: ${{ secrets.POSTGRID_TEST_KEY }}
          POSTGRID_LIVE_KEY: ${{ secrets.POSTGRID_LIVE_KEY }}
