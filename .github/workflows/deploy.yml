name: Deploy protected Worker

# Deployment is manual and only runs the reviewed default branch, never PR code.
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: simpledocs-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: Build and test
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm verify
      - name: Verify recipient portal configuration without sending
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PORTAL_KEY: ${{ secrets.PORTAL_KEY }}
          PORTAL_PREVIOUS_KEY: ${{ secrets.PORTAL_PREVIOUS_KEY }}
          TELNYX_API_TOKEN: ${{ secrets.TELNYX_API_TOKEN }}
          TELNYX_VERIFY_PROFILE_ID: ${{ vars.TELNYX_VERIFY_PROFILE_ID }}
        run: node web/worker/portal-production.mjs
      # The action's `secrets` input deploys a separate version before deploy.
      # Upload secrets with the new code instead, including during key rotation.
      - name: Prepare temporary deploy secret file
        env:
          TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
          TELNYX_API_TOKEN: ${{ secrets.TELNYX_API_TOKEN }}
          POSTGRID_TEST_KEY: ${{ secrets.POSTGRID_TEST_KEY }}
          POSTGRID_LIVE_KEY: ${{ secrets.POSTGRID_LIVE_KEY }}
          PORTAL_KEY: ${{ secrets.PORTAL_KEY }}
          PORTAL_PREVIOUS_KEY: ${{ secrets.PORTAL_PREVIOUS_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const names = ['TELNYX_API_TOKEN', 'POSTGRID_TEST_KEY', 'POSTGRID_LIVE_KEY', 'TELNYX_PUBLIC_KEY', 'PORTAL_KEY'];
          for (const name of names) if (!process.env[name]) throw new Error(`Missing ${name}`);
          if (process.env.PORTAL_PREVIOUS_KEY) names.push('PORTAL_PREVIOUS_KEY');
          writeFileSync(`${process.env.RUNNER_TEMP}/simpledocs-secrets.json`, JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), { mode: 0o600, flag: 'wx' });
          NODE
      - name: Configure protected hostname
        id: access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/worker/access-app.mjs
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: 4.163.0
          command: d1 migrations apply simpledocs-d1-prod --remote
      - name: Deploy protected Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: 4.163.0
          command: deploy --secrets-file "${{ runner.temp }}/simpledocs-secrets.json" --var ACCESS_TEAM_DOMAIN:https://justinharbour.cloudflareaccess.com --var ACCESS_AUDIENCE:${{ steps.access.outputs.audience }} --var TELNYX_VERIFY_PROFILE_ID:${{ vars.TELNYX_VERIFY_PROFILE_ID }}
      - name: Remove temporary deploy secret file
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/simpledocs-secrets.json"
      - name: Publish exact recipient routes after deploying authenticated Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node web/worker/access-app.mjs --publish-portal
      - name: Verify public and protected edge routes without sending
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PORTAL_KEY: ${{ secrets.PORTAL_KEY }}
          TELNYX_API_TOKEN: ${{ secrets.TELNYX_API_TOKEN }}
          TELNYX_VERIFY_PROFILE_ID: ${{ vars.TELNYX_VERIFY_PROFILE_ID }}
        run: node web/worker/portal-production.mjs --check-edge
