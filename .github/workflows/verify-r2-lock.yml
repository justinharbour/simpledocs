name: Verify isolated R2 locking

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: simpledocs-r2-lock-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenTofu 1.13.9
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/tofu.zip" \
            https://github.com/opentofu/opentofu/releases/download/v1.13.9/tofu_1.13.9_linux_amd64.zip
          echo 'bc44eb6b06446ba83bd4072114891987f590f66cca712737a7f1147c50c539ce  '"$RUNNER_TEMP/tofu.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/tofu.zip" tofu -d "$RUNNER_TEMP/tofu-bin"
          echo "$RUNNER_TEMP/tofu-bin" >> "$GITHUB_PATH"
      - name: Exercise isolated state locking
        env:
          CF_S3_ENDPOINT: ${{ vars.CF_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
        run: |
          aws --version
          python3 infra/tofu/verify_r2_lock.py
