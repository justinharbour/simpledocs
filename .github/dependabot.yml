version: 2

# npm and other package ecosystems are added when the application skeletons are merged.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
